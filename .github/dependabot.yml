version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      ci-actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      compatible-packages:
        patterns: ['*']
        update-types: [minor, patch]
    # Compiler/runtime migrations need coordinated changes to engines, CI, and Docker.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
      # Keep nginx on its supported stable line; 1.31 is the mainline release track.
      - dependency-name: nginxinc/nginx-unprivileged
        versions: ['>=1.31, <1.32']
