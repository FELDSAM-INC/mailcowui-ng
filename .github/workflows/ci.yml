# CI of mailcowui-ng. Performance and accessibility checks are opt-in per the owner.
# Public images publish only from trusted main/tag builds after the quality and image checks.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PUBLISH_IMAGES: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
  NODE_VERSION: '24'
  IMAGE_NAME: ghcr.io/feldsam-inc/mailcowui-ng

jobs:
  security:
    uses: ./.github/workflows/security.yml

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Test subscription scan runner (no model calls)
        run: node --test scripts/security/scan-local.test.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run contract:check
      - run: npm run i18n:check
      - run: npm run licenses:check
      - run: npm run audit
      - name: Unit tests and coverage
        timeout-minutes: 20
        run: npm run test:unit -- --maxWorkers=2 --coverage.processingConcurrency=2 --reporter=verbose --reporter=github-actions
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build the frontend once and export dist
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/Dockerfile
          target: build-output
          platforms: linux/amd64
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=ui-assets-linux-amd64
          cache-to: type=gha,scope=ui-assets-linux-amd64,mode=max
      - if: vars.PERFORMANCE_CHECKS_ENABLED == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - if: vars.PERFORMANCE_CHECKS_ENABLED == 'true'
        run: npm run budget:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 7

  e2e:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          SKIP_A11Y: ${{ vars.ACCESSIBILITY_CHECKS_ENABLED != 'true' && '1' || '0' }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  lighthouse:
    if: vars.PERFORMANCE_CHECKS_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: npm run lhci
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14

  image:
    name: Production image (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Image tags and source labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/feldsam-inc/mailcowui-ng
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=match,pattern=v(.*),group=1
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-only
      - name: Log in to GHCR
        if: env.PUBLISH_IMAGES == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the native platform image once
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/Dockerfile
          target: prebuilt
          platforms: linux/${{ matrix.arch }}
          push: ${{ env.PUBLISH_IMAGES == 'true' }}
          load: ${{ env.PUBLISH_IMAGES != 'true' }}
          tags: ${{ env.IMAGE_NAME }}:scan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          sbom: ${{ env.PUBLISH_IMAGES == 'true' }}
          provenance: ${{ env.PUBLISH_IMAGES == 'true' && 'mode=max' || 'false' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ui-production-linux-${{ matrix.arch }}
          cache-to: type=gha,scope=ui-production-linux-${{ matrix.arch }},mode=max
      - name: Select the exact image to test
        id: reference
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          if [ "$PUBLISH_IMAGES" = 'true' ]; then
            [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            reference="$IMAGE_NAME@$IMAGE_DIGEST"
          else
            reference="$IMAGE_NAME:scan-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$IMAGE_ARCH"
          fi
          echo "image=$reference" >> "$GITHUB_OUTPUT"
      - name: Scan the platform image
        env:
          IMAGE_REFERENCE: ${{ steps.reference.outputs.image }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: python3 scripts/security/check.py image --image "$IMAGE_REFERENCE" --platform "linux/$IMAGE_ARCH"
      - name: Retain image scan and SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: production-image-security-linux-${{ matrix.arch }}
          path: security-reports/
          retention-days: 7
      - name: Check the container
        env:
          IMAGE_REFERENCE: ${{ steps.reference.outputs.image }}
        run: |
          docker run -d --name ng --read-only --tmpfs /tmp --tmpfs /var/cache/nginx \
            -p 127.0.0.1:8080:8080 "$IMAGE_REFERENCE"
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8080/ng/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ng/ | grep -q '<div id="app">'
          curl -fsS http://127.0.0.1:8080/ng/api-keys | grep -q '<div id="app">'
          curl -fsS http://127.0.0.1:8080/domains | grep -q '<div id="app">'
          curl -fsS http://127.0.0.1:8080/ng/deployment.json \
            | python3 -c 'import json, sys; manifest = json.load(sys.stdin); assert manifest["rootRoutingVersion"] == 1; assert set(manifest["supportedUiPaths"]) == {"/", "/ng/"}'
          curl -fsSI http://127.0.0.1:8080/ng/ | grep -qi "^content-security-policy: default-src 'none'"
          # Credential routes serve the app and CSP without recording any part of the request.
          for path in /ng/sso/return /ng/sso/return/ /sso/return /sso/return/ \
            /ng/reset-password /ng/reset-password/ /reset-password /reset-password/; do
            curl -fsS -A credential-route-log-test \
              -e 'https://example.test/reset-password?token=RESET_TOKEN_LOG_SENTINEL' \
              "http://127.0.0.1:8080${path}?code=SSO_CODE_LOG_SENTINEL&state=x&token=RESET_TOKEN_LOG_SENTINEL" \
              | grep -q '<div id="app">'
            curl -fsSI "http://127.0.0.1:8080${path}" \
              | grep -qi "^content-security-policy: default-src 'none'"
          done
          # A normal request proves logs are readable; allow Docker to flush its log stream.
          curl -fsS -o /dev/null -A public-route-log-test http://127.0.0.1:8080/ng/
          for i in $(seq 1 30); do
            docker logs ng > /tmp/ng-container.log 2>&1
            if grep -q 'public-route-log-test' /tmp/ng-container.log; then break; fi
            sleep 0.1
          done
          grep -q 'public-route-log-test' /tmp/ng-container.log
          ! grep -Eq 'credential-route-log-test|SSO_CODE_LOG_SENTINEL|RESET_TOKEN_LOG_SENTINEL' /tmp/ng-container.log
          asset=$(curl -fsS http://127.0.0.1:8080/ng/ | grep -o '/ng/assets/[^"]*\.js' | head -1)
          curl -fsSI "http://127.0.0.1:8080${asset}" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          docker exec ng sh -c '! find /usr/share/nginx/html -name "*.map" | grep -q .'
      - if: always()
        run: docker logs ng || true
      - name: Record the verified platform digest
        if: env.PUBLISH_IMAGES == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/digests/linux-$IMAGE_ARCH.txt"
      - if: env.PUBLISH_IMAGES == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-digest-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/linux-${{ matrix.arch }}.txt
          overwrite: true
          retention-days: 1

  smoke:
    needs: image
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || vars.SMOKE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    env:
      HAS_TOKEN: ${{ secrets.MAILCOW_REST_V2_TOKEN != '' }}
      MAILCOW_REST_V2_DIR: ${{ github.workspace }}/api
      SMOKE_API_REF: ${{ vars.SMOKE_API_REF }}
      # UI 012: the API's idp profile (OpenLDAP, and Keycloak with its realm import) for the @idp
      # and @sso smoke tests.
      SMOKE_IDP: '1'
      # UI 009: the API stack's SMTP test target (mailpit) for the routing connection tests.
      SMOKE_COMPOSE_PROFILES: routing
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ui
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FELDSAM-INC/mailcow-rest-v2
          token: ${{ secrets.MAILCOW_REST_V2_TOKEN }}
          path: api
          fetch-depth: 0
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::MAILCOW_REST_V2_TOKEN is not set; the smoke suite is skipped."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - if: env.HAS_TOKEN == 'true'
        run: npm ci && npx playwright install --with-deps chromium
      - if: env.HAS_TOKEN == 'true'
        run: scripts/smoke/stack-up.sh
      - if: env.HAS_TOKEN == 'true'
        run: npm run test:smoke
        env:
          SKIP_A11Y: ${{ vars.ACCESSIBILITY_CHECKS_ENABLED != 'true' && '1' || '0' }}
          SMOKE_BASE_URL: http://localhost:18480/ng/
      - if: always() && env.HAS_TOKEN == 'true'
        run: scripts/smoke/stack-down.sh

  publish:
    name: Publish public image
    needs: [quality, build, image, security]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tags and source labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/feldsam-inc/mailcowui-ng
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=match,pattern=v(.*),group=1
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-only
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: image-digest-linux-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Assemble the already tested platform images
        id: publish
        run: |
          sources=()
          for architecture in amd64 arm64; do
            digest="$(cat "$RUNNER_TEMP/digests/linux-$architecture.txt")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            sources+=("$IMAGE_NAME@$digest")
          done
          candidate="$IMAGE_NAME:scan-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx imagetools create --tag "$candidate" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' | jq -r '.digest')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Scan both candidate architectures before promoting release tags
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          python3 scripts/security/check.py image --image "ghcr.io/feldsam-inc/mailcowui-ng@$IMAGE_DIGEST" --platform linux/amd64
          python3 scripts/security/check.py image --image "ghcr.io/feldsam-inc/mailcowui-ng@$IMAGE_DIGEST" --platform linux/arm64
      - name: Promote verified image to public release tags
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] || args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create "${args[@]}" "ghcr.io/feldsam-inc/mailcowui-ng@$IMAGE_DIGEST"
      - name: Retain release scans and SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-image-security
          path: security-reports/
          retention-days: 14
      - name: Record published image
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Container image'
            printf '\n%s\n' "$IMAGE_TAGS"
            printf '\nDigest: `%s`\n' "$IMAGE_DIGEST"
            echo 'First publication requires Package settings → Change visibility → Public.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify anonymous registry access
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_config"' EXIT
          if ! docker --config "$anonymous_config" manifest inspect "ghcr.io/feldsam-inc/mailcowui-ng@$IMAGE_DIGEST" > /dev/null; then
            echo '::error::Image was pushed but is not publicly pullable. Set this GHCR package visibility to Public, then rerun the publishing job.'
            exit 1
          fi
