# nginx configuration of the mailcowui-ng image (research R29). Listens on 8080 as a non-root
# user. mailcow-rest-v2's site.restv2.custom proxies /ng/ here with the original URI.
# Reset links carry a credential in the query. Log only the URI path, with no query or referrer.
log_format ng_path '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                   '"$http_user_agent"';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    root /usr/share/nginx/html;
    access_log /dev/stdout ng_path;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

    # Direct access to the container only: the app lives under /ng/.
    location = / {
        return 302 /ng/;
    }

    location = /ng {
        return 301 /ng/$is_args$args;
    }

    location = /ng/healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed files: cached for a year.
    location /ng/assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /ng/index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /ng/theme-init.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # UI 012 (research R5): the single sign-on return. The provider sends the browser here with a
    # single-use code and state in the query, so this address is never written to the access log.
    location = /ng/sso/return {
        access_log off;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /ng/index.html =404;
    }

    # The offline showcase is a download; its embedded assets execute only when opened locally.
    location = /ng/showcase/mailcowui-ng-showcase.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Content-Disposition 'attachment; filename="mailcowui-ng-showcase.html"' always;
        try_files $uri =404;
    }

    # Public static tour. Missing screenshots must not resolve to the app entry point.
    location /ng/showcase/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Every other address of the app gets the SPA entry point (deep links).
    location /ng/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /ng/index.html;
    }
}
