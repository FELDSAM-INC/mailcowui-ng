# Security headers of the mailcowui-ng image (research R18, R29).
# Included in every nginx location that serves content. vite.config.ts parses this file for
# `vite preview`, so the end-to-end tests run with exactly this policy.
# X-Content-Type-Options, X-Frame-Options and Referrer-Policy are deliberately absent:
# nginx-mailcow already sets them at server level.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
